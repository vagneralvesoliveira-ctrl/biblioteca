name: Atualizar biblioteca

on:
  push:
    branches: [main]
    paths: [livros.txt, scripts/baixar_livros.py]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: biblioteca
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Baixar livros da lista
        run: python scripts/baixar_livros.py
      - name: Salvar no repositório
        run: |
          git config user.name "estante-bot"
          git config user.email "estante-bot@users.noreply.github.com"
          git add books catalog.json
          if git diff --cached --quiet; then
            echo "Nada novo."
          else
            git commit -m "Atualiza biblioteca pronta"
            git push
          fi
